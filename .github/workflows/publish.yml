name: publish

# Publishes the npm package when a v* tag is pushed (npm version + git push
# --follow-tags). Also creates the GitHub Release and moves the floating
# major tag (v0, v1, …) so `uses: anomalyco/codegraph-viz@v1` stays current.
on:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the GitHub Release + push the moving major tag
  id-token: write  # npm provenance statements

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build singlefile template
        run: pnpm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # Keeps `v<major>` pointing at the newest release of that major so the
      # action's floating-tag users get fixes without changing their workflow.
      - name: Update major version tag
        run: |
          major="${GITHUB_REF_NAME#v}"
          major="${major%%.*}"
          git tag -f "v${major}" "$GITHUB_REF_NAME"
          git push -f origin "v${major}"
        env:
          GH_TOKEN: ${{ github.token }}
